services:
  postgres:
    image: postgres:16-alpine
    container_name: s360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: s360
      POSTGRES_PASSWORD: s360local
      POSTGRES_DB: s360
    ports:
      - "5432:5432"
    volumes:
      - s360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s360 -d s360"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  s360_pgdata:
